version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: investcontrol-postgres
    environment:
      POSTGRES_DB: investcontrol
      POSTGRES_USER: investcontrol
      POSTGRES_PASSWORD: investcontrol
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investcontrol -d investcontrol"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: investcontrol-backend
    environment:
      APP_NAME: InvestControl API
      APP_ENV: development
      APP_DEBUG: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql://investcontrol:investcontrol@postgres:5432/investcontrol
      SECRET_KEY: mude-esta-chave-em-producao
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      BRAPI_TOKEN: ""
      MARKET_DATA_CACHE_MINUTES: "15"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: investcontrol-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
